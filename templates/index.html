<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIU Game</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        h1, h2 { text-align: center; }
        .current-string { font-size: 2em; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .rules { margin-bottom: 20px; display: flex; justify-content: space-around; }
        .rules form { margin: 5px; }
        .history { margin-top: 30px; }
        .history h3 { margin-bottom: 10px; }
        .history ul { list-style-type: none; padding: 0; }
        .history li { background-color: #f9f9f9; border: 1px solid #eee; padding: 8px; margin-bottom: 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MIU Game</h1>
        <div class="current-string">
            {{ current_string }}
        </div>
        <h2>Apply Rules</h2>
        <div class="rules">
            <form action="{{ url_for('apply_rule_route', rule_num=1) }}" method="post">
                <button type="submit">Apply Rule 1 (Add U if ends with I)</button>
            </form>
            <form action="{{ url_for('apply_rule_route', rule_num=2) }}" method="post">
                <button type="submit">Apply Rule 2 (Mx -> Mxx)</button>
            </form>
            <form action="{{ url_for('apply_rule_route', rule_num=3) }}" method="post">
                <button type="submit">Apply Rule 3 (III -> U)</button>
            </form>
            <form action="{{ url_for('apply_rule_route', rule_num=4) }}" method="post">
                <button type="submit">Apply Rule 4 (UU -> delete)</button>
            </form>
        </div>
        <div class="history">
            <h3>History</h3>
            <ul>
                {% for item in history %}
                    <li>{{ item }}</li>
                {% endfor %}
            </ul>
        </div>
        <div>
            <form action="{{ url_for('reset_game') }}" method="post" style="text-align: center; margin-top: 20px;">
                <button type="submit">Reset Game</button>
            </form>
        </div>
    </div>
</body>
</html>
